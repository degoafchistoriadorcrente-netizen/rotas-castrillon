ay:block}.form input,.form select{width:100%;padding:12px;margin:6px 0;border:1px solid #ccd3df;border-radius:10px;font-size:15px}.form button{padding:12px 14px;border:0;border-radius:10px;font-weight:800;margin:4px 3px 0 0}.save{background:#198754;color:#fff}.cancel{background:#e9edf3;color:#243}.custom{border-left:4px solid #198754}.manage{display:flex;gap:7px;margin-top:8px}.manage button{flex:1;padding:10px;border-radius:10px;border:1px solid #d8dee8;background:#fff;font-weight:700}.edit{color:#174ea6}.del{color:#b42318}</style></head><body><header><h1>🚗 Rotas Castrillon</h1><p>Entregas de autopeças • Porangatu-GO</p></header><div class="tools"><input id="q" class="search" placeholder="🔎 Buscar oficina..."><div id="regions" class="regions"></div></div><button class="add" id="addBtn">➕ ADICIONAR LOCAL</button><div id="form" class="form"><h2 style="margin:0 0 8px">Novo local</h2><input id="newName" placeholder="Nome da oficina / local"><select id="newRegion"></select><input id="newAddress" placeholder="Endereço completo"><input id="newPhone" placeholder="Telefone (opcional)" type="tel"><button class="save" id="saveBtn">💾 SALVAR LOCAL</button><button class="cancel" id="cancelBtn">CANCELAR</button></div><div id="app"></div><footer>Origem: Castrillon Autopeças • Toque em “IR PARA A OFICINA”.</footer><script>

let region="Todas";let custom=[];try{const saved=JSON.parse(localStorage.getItem("rotasCastrillonLocais")||"[]");custom=Array.isArray(saved)?saved:[]}catch(e){custom=[];localStorage.removeItem("rotasCastrillonLocais")}let editingIndex=-1;const allData=function(){return data.concat(custom)};
const esc=function(s){return s.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")};
const maps=function(dest,name){return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(name+", "+dest)+"&travelmode=driving&dir_action=navigate"};
function render(){const q=document.getElementById("q").value.toLowerCase().trim();const rows=allData().filter(function(x){return (region==="Todas"||x[0]===region)&&(!q||x.join(" ").toLowerCase().includes(q))});let html="";rows.forEach(function(x,i){const ci=custom.indexOf(x);html+='<section class="route '+(ci>-1?"custom":"")+'"><h2>'+(i+1)+'. '+esc(x[1])+'</h2><div class="badge">📍 '+esc(x[0])+'</div><div class="address">'+esc(x[2])+'</div><a class="map" href="'+maps(x[2],x[1])+'" target="_blank" rel="noopener">🗺️ IR PARA A OFICINA</a>'+(x[3]?'<a class="phone" href="tel:'+x[3].replace(/\D/g,'')+'">📞 '+esc(x[3])+'</a>':"")+(ci>-1?'<div class="manage"><button class="edit" onclick="editLocal('+ci+')">✏️ EDITAR</button><button class="del" onclick="deleteLocal('+ci+')">🗑️ EXCLUIR</button></div>':"")+'</section>'});document.getElementById("app").innerHTML=html+'<div class="count">'+rows.length+' oficina(s) encontrada(s)</div>'}
function editLocal(i){const x=custom[i];editingIndex=i;document.getElementById("newName").value=x[1];document.getElementById("newAddress").value=x[2];document.getElementById("newPhone").value=x[3]||"";const sel=document.getElementById("newRegion");let op=Array.from(sel.options).find(o=>o.value===x[0]);if(!op){op=document.createElement("option");op.value=x[0];op.textContent=x[0];sel.insertBefore(op,sel.lastElementChild)}sel.value=x[0];document.getElementById("form").classList.add("show");document.getElementById("saveBtn").textContent="💾 ATUALIZAR LOCAL";window.scrollTo({top:document.getElementById("form").offsetTop-100,behavior:"smooth"})}
function deleteLocal(i){if(confirm("Excluir "+custom[i][1]+"?")){custom.splice(i,1);localStorage.setItem("rotasCastrillonLocais",JSON.stringify(custom));regions();render()}}
function setupForm(){const sel=document.getElementById("newRegion");const rs=Array.from(new Set(data.map(function(x){return x[0]})));sel.innerHTML=rs.map(function(r){return '<option value="'+esc(r)+'">'+esc(r)+'</option>'}).join('')+'<option value="__nova">➕ Nova região</option>';document.getElementById("addBtn").onclick=function(){editingIndex=-1;document.getElementById("newName").value="";document.getElementById("newAddress").value="";document.getElementById("newPhone").value="";document.getElementById("saveBtn").textContent="💾 SALVAR LOCAL";document.getElementById("form").classList.add("show")};document.getElementById("cancelBtn").onclick=function(){editingIndex=-1;document.getElementById("form").classList.remove("show");document.getElementById("saveBtn").textContent="💾 SALVAR LOCAL"};sel.onchange=function(){if(sel.value==="__nova"){const n=prompt("Digite o nome da nova região:");if(n&&n.trim()){const name=n.trim();const o=document.createElement("option");o.value=name;o.textContent=name;sel.insertBefore(o,sel.lastElementChild);sel.value=name}else sel.selectedIndex=0}};document.getElementById("saveBtn").onclick=function(){const n=document.getElementById("newName").value.trim(),a=document.getElementById("newAddress").value.trim(),p=document.getElementById("newPhone").value.trim(),r=sel.value;if(!n||!a||!r||r==="__nova"){alert("Preencha o nome, a região e o endereço.");return}const item=[r,n,a,p];if(editingIndex>=0&&editingIndex<custom.length){custom[editingIndex]=item}else{custom.push(item)}localStorage.setItem("rotasCastrillonLocais",JSON.stringify(custom));editingIndex=-1;document.getElementById("newName").value="";document.getElementById("newAddress").value="";document.getElementById("newPhone").value="";document.getElementById("form").classList.remove("show");document.getElementById("saveBtn").textContent="💾 SALVAR LOCAL";regions();render();alert("Local salvo com sucesso!")}}}
function regions(){const rs=["Todas"].concat(Array.from(new Set(allData().map(function(x){return x[0]}))));let html="";rs.forEach(function(r){html+='<button class="'+(r===region?"active":"")+'" data-r="'+esc(r)+'">'+esc(r)+'</button>'});document.getElementById("regions").innerHTML=html;document.querySelectorAll("#regions button").forEach(function(b){b.onclick=function(){region=b.getAttribute("data-r");regions();render()}})}
